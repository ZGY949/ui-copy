<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc">
<title id="title">把必要说明放回字段标签和提示</title>
  <desc id="desc">相同的新建项目表单、品牌官网输入值和创建按钮。改前项目名称与20字限制集中在顶部；改后移为字段标签和输入框下方提示。输入内容和限制不变。</desc>
<g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1000" height="1150" rx="22" fill="#F7F9F8" />
  <text x="32" y="53" font-size="32" fill="#5D6B73" font-weight="600" text-anchor="start" >改前</text>
  <text x="968" y="53" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end" >字段信息集中在一段说明里</text>
  <rect x="32" y="84" width="936" height="425" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="159" font-size="43" fill="#182A35" font-weight="650" text-anchor="start" >新建项目</text>
  <rect x="62" y="192" width="876" height="108" rx="10" fill="#FFF3B9" />
  <text x="78" y="235" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start" >请在下方输入项目名称，</text>
  <text x="78" y="283" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start" >名称不超过 20 个字。</text>
  <rect x="66" y="330" width="868" height="66" rx="10" fill="#FFFFFF" stroke="#AABAC3" stroke-width="2" />
  <text x="86" y="376" font-size="36" fill="#182A35" font-weight="400" text-anchor="start" >品牌官网</text>
  <rect x="66" y="422" width="220" height="58" rx="10" fill="#182A35" />
  <text x="176" y="463" font-size="31" fill="#FFFFFF" font-weight="600" text-anchor="middle" >创建项目</text>
  <path d="M481 536H519V561H540L500 602L460 561H481Z" fill="#182A35"/>
  <text x="560" y="579" font-size="32" fill="#182A35" font-weight="650" text-anchor="start" >信息回到字段附近</text>
  <text x="32" y="632" font-size="32" fill="#182A35" font-weight="650" text-anchor="start" >改后</text>
  <text x="968" y="632" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end" >标签与要求在填写时可见</text>
  <rect x="32" y="660" width="936" height="425" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="735" font-size="43" fill="#182A35" font-weight="650" text-anchor="start" >新建项目</text>
  <rect x="61" y="771" width="194" height="54" rx="8" fill="#FFF3B9" />
  <text x="72" y="810" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >项目名称</text>
  <rect x="66" y="844" width="868" height="66" rx="10" fill="#FFFFFF" stroke="#AABAC3" stroke-width="2" />
  <text x="86" y="890" font-size="36" fill="#182A35" font-weight="400" text-anchor="start" >品牌官网</text>
  <rect x="61" y="927" width="242" height="50" rx="8" fill="#FFF3B9" />
  <text x="72" y="962" font-size="32" fill="#5D6B73" font-weight="400" text-anchor="start" >最多 20 个字</text>
  <rect x="66" y="998" width="220" height="58" rx="10" fill="#182A35" />
  <text x="176" y="1039" font-size="31" fill="#FFFFFF" font-weight="600" text-anchor="middle" >创建项目</text>
