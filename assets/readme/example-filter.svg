<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">把筛选说明转成列表旁的状态筛选</title>
  <desc id="desc">同一个项目列表的改前与改后示意。改前只有解释如何按项目状态筛选的文字，列表展示进行中的品牌官网和已完成的产品手册。改后提供全部、进行中、已完成三个筛选项，选中进行中后只展示品牌官网。图示不提供真实筛选功能。</desc>
  <rect width="1200" height="1040" rx="24" fill="#F7F5EE"/>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" fill="#1E2422">
    <g id="before">
      <text x="60" y="71" font-size="40" font-weight="600" fill="#626B65">改前 · 写了说明，仍缺少直接入口</text>
      <rect x="60" y="106" width="1080" height="390" rx="20" fill="#FFFFFF" stroke="#D4D9D2" stroke-width="2"/>
      <text x="100" y="187" font-size="54" font-weight="600">我的项目</text>
      <text x="100" y="260" font-size="42" fill="#626B65">你可以按项目状态筛选列表，</text>
      <text x="100" y="316" font-size="42" fill="#626B65">查看进行中或已完成的项目。</text>
      <path d="M100 348h1000M100 420h1000" stroke="#E5E8E2" stroke-width="2"/>
      <text x="100" y="398" font-size="42">品牌官网</text>
      <text x="1100" y="396" text-anchor="end" font-size="36" fill="#626B65">进行中</text>
      <text x="100" y="470" font-size="42">产品手册</text>
      <text x="1100" y="468" text-anchor="end" font-size="36" fill="#626B65">已完成</text>
    </g>
    <g id="after">
      <text x="60" y="591" font-size="40" font-weight="600" fill="#137761">改后 · 看见选项，直接筛选</text>
      <rect x="60" y="626" width="1080" height="286" rx="20" fill="#FFFFFF" stroke="#D4D9D2" stroke-width="2"/>
      <text x="100" y="707" font-size="54" font-weight="600">我的项目</text>
      <rect x="100" y="741" width="750" height="72" rx="14" fill="#F3F5F0" stroke="#D4D9D2" stroke-width="2"/>
      <rect x="305" y="747" width="264" height="60" rx="10" fill="#137761"/>
      <text x="204" y="791" text-anchor="middle" font-size="42">全部</text>
      <text x="437" y="791" text-anchor="middle" font-size="42" font-weight="600" fill="#FFFFFF">进行中</text>
      <text x="706" y="791" text-anchor="middle" font-size="42">已完成</text>
      <path d="M100 839h1000" stroke="#E5E8E2" stroke-width="2"/>
      <text x="100" y="892" font-size="42">品牌官网</text>
      <text x="1100" y="890" text-anchor="end" font-size="36" fill="#626B65">进行中</text>
    </g>
    <g id="selection-explanation">
      <path d="M438 810v34m-12-12 12 12 12-12" fill="none" stroke="#137761" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="990" font-size="38" fill="#137761">选择“进行中”，列表只显示对应项目。</text>
    </g>
  </g>
</svg>
