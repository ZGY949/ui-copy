<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
<title id="title">把筛选说明变成操作与结果</title>
  <desc id="desc">两边使用相同品牌官网和产品手册数据。改前写出筛选说明，改后提供全部、进行中、已完成控件，进行中选中后只显示品牌官网。人工静态示意，不证明真实业务实现。</desc>
<g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1000" height="1010" rx="22" fill="#F7F9F8" />
  <text x="32" y="53" font-size="32" fill="#5D6B73" font-weight="600" text-anchor="start" >改前</text>
  <text x="968" y="53" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end" >解释了筛选，却缺少操作入口</text>
  <rect x="32" y="84" width="936" height="365" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="159" font-size="43" fill="#182A35" font-weight="650" text-anchor="start" >我的项目</text>
  <rect x="62" y="192" width="876" height="108" rx="10" fill="#FFF3B9" />
  <text x="78" y="235" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start" >你可以按项目状态筛选列表，</text>
  <text x="78" y="283" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start" >查看进行中或已完成的项目。</text>
  <path d="M66 300H934" stroke="#D7DFE3" stroke-width="2"/>
  <text x="66" y="349" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >品牌官网</text>
  <text x="934" y="348" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end" >进行中</text>
  <path d="M66 379H934" stroke="#D7DFE3" stroke-width="2"/>
  <text x="66" y="430" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >产品手册</text>
  <text x="934" y="429" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end" >已完成</text>
  <path d="M481 476H519V501H540L500 542L460 501H481Z" fill="#182A35"/>
  <text x="560" y="519" font-size="32" fill="#182A35" font-weight="650" text-anchor="start" >转为可用的筛选</text>
  <text x="32" y="562" font-size="32" fill="#182A35" font-weight="650" text-anchor="start" >改后</text>
  <text x="968" y="562" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end" >选中状态，直接查看对应项目</text>
  <rect x="32" y="590" width="936" height="365" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="665" font-size="43" fill="#182A35" font-weight="650" text-anchor="start" >我的项目</text>
  <rect x="66" y="701" width="868" height="73" rx="12" fill="#EDF2F4" stroke="#D7DFE3" stroke-width="2" />
  <rect x="320" y="708" width="300" height="59" rx="9" fill="#F3D46C" />
  <text x="193" y="748" font-size="36" fill="#182A35" font-weight="400" text-anchor="middle" >全部</text>
  <text x="470" y="748" font-size="36" fill="#182A35" font-weight="650" text-anchor="middle" >进行中</text>
  <text x="777" y="748" font-size="36" fill="#182A35" font-weight="400" text-anchor="middle" >已完成</text>
  <path d="M66 798H934" stroke="#D7DFE3" stroke-width="2"/>
  <text x="66" y="847" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >品牌官网</text>
  <text x="934" y="846" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end" >进行中</text>
  </g>
  </svg>
