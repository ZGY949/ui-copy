<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">UI Copy：让界面文字说清楚</title>
  <desc id="desc">界面文案技能。以打开文件选择器为例，将提前宣告结果的“上传完成”改为实际动作“选择文件”。</desc>

  <!-- 文字校样：纸白底、墨色标题、深绿修订与红色删除线。示例来自 references/patterns.md。 -->
  <rect width="1200" height="420" rx="24" fill="#F7F5EE"/>

  <g id="identity" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="60" y="66" font-size="22" font-weight="600" letter-spacing="2.2" fill="#626B65">UX WRITING SKILL</text>
    <text x="53" y="197" font-size="116" font-weight="650" letter-spacing="-4" fill="#1E2422">ui-copy</text>
    <text x="60" y="267" font-size="46" font-weight="600" fill="#1E2422">让界面文字说清楚</text>
    <text x="62" y="311" font-size="26" fill="#626B65">少一句重复，多一句事实。</text>
  </g>

  <g id="copy-proof" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <path d="M668 84h32M668 84v32M1138 294h-32M1138 294v-32" fill="none" stroke="#1E2422" stroke-width="2" opacity="0.2"/>
    <text x="716" y="115" font-size="24" fill="#626B65">打开文件选择器时</text>
    <text x="716" y="182" font-size="54" font-weight="500" fill="#626B65">上传完成</text>
    <path d="M710 160l239-7" fill="none" stroke="#C54D43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M1002 154v62m-8-10 8 10 8-10" fill="none" stroke="#137761" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="716" y="253" font-size="60" font-weight="650" fill="#137761">选择文件</text>
    <text x="716" y="301" font-size="23" fill="#626B65">写眼前的动作，再判断结果。</text>
  </g>

  <g id="scope" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <path d="M60 346h1080" stroke="#1E2422" stroke-width="1" opacity="0.14"/>
    <text x="62" y="383" font-size="22" fill="#626B65">按钮 · 表单 · 状态 · 错误 · 确认</text>
    <text x="1138" y="383" text-anchor="end" font-size="21" fill="#137761">MIT · AGENT SKILL</text>
  </g>
</svg>
