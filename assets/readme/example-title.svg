<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
<title id="title">删除重复介绍，用我的项目作为标题</title>
  <desc id="desc">两边使用相同项目、状态、新建按钮和视口。暖黄标注改前重复介绍与改后我的项目标题，重复说明删除，任务数据和入口保留。</desc>
<g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1000" height="1010" rx="22" fill="#F7F9F8" />
  <text x="32" y="53" font-size="32" fill="#5D6B73" font-weight="600" text-anchor="start" >改前</text>
  <text x="968" y="53" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end" >重复介绍了已有内容</text>
  <rect x="32" y="84" width="936" height="365" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="159" font-size="43" fill="#182A35" font-weight="650" text-anchor="start" >项目</text>
  <rect x="714" y="115" width="220" height="56" rx="10" fill="#182A35" />
  <text x="824" y="154" font-size="29" fill="#FFFFFF" font-weight="600" text-anchor="middle" >＋ 新建项目</text>
  <rect x="62" y="192" width="876" height="108" rx="10" fill="#FFF3B9" />
  <text x="78" y="235" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start" >在这里，你可以查看和管理</text>
  <text x="78" y="283" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start" >自己创建的所有项目。</text>
  <path d="M66 300H934" stroke="#D7DFE3" stroke-width="2"/>
  <text x="66" y="349" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >品牌官网</text>
  <text x="934" y="348" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end" >进行中</text>
  <path d="M66 379H934" stroke="#D7DFE3" stroke-width="2"/>
  <text x="66" y="430" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >产品手册</text>
  <text x="934" y="429" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end" >已完成</text>
  <path d="M481 476H519V501H540L500 542L460 501H481Z" fill="#182A35"/>
  <text x="560" y="519" font-size="32" fill="#182A35" font-weight="650" text-anchor="start" >删重复 · 缩表达</text>
  <text x="32" y="562" font-size="32" fill="#182A35" font-weight="650" text-anchor="start" >改后</text>
  <text x="968" y="562" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end" >标题和列表直接说明用途</text>
  <rect x="32" y="590" width="936" height="365" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <rect x="61" y="619" width="241" height="68" rx="9" fill="#FFF3B9" />
  <text x="76" y="665" font-size="43" fill="#182A35" font-weight="650" text-anchor="start" >我的项目</text>
  <rect x="714" y="621" width="220" height="56" rx="10" fill="#182A35" />
  <text x="824" y="660" font-size="29" fill="#FFFFFF" font-weight="600" text-anchor="middle" >＋ 新建项目</text>
  <path d="M66 703H934" stroke="#D7DFE3" stroke-width="2"/>
  <text x="66" y="752" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >品牌官网</text>
  <text x="934" y="751" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end" >进行中</text>
  <path d="M66 782H934" stroke="#D7DFE3" stroke-width="2"/>
  <text x="66" y="833" font-size="36" fill="#182A35" font-weight="600" text-anchor="start" >产品手册</text>
  <text x="934" y="832" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end" >已完成</text>
