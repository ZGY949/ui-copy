<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Put essential information in the field label and hint</title>
  <desc id="desc">The same New project form, Brand website input value, and Create action. The project name and 20-character limit move from a paragraph at the top to the label and a hint below the input. The value and limit remain unchanged.</desc>
<g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1000" height="1150" rx="22" fill="#F7F9F8" />
  <text x="32" y="53" font-size="32" fill="#5D6B73" font-weight="600" text-anchor="start">Before</text>
  <text x="968" y="53" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end">Field information is buried in a paragraph</text>
  <rect x="32" y="84" width="936" height="425" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="159" font-size="43" fill="#182A35" font-weight="650" text-anchor="start">New project</text>
  <rect x="62" y="192" width="876" height="108" rx="10" fill="#FFF3B9" />
  <text x="78" y="235" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start">Please enter a project name below.</text>
  <text x="78" y="283" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start">The name must be 20 characters or fewer.</text>
  <rect x="66" y="330" width="868" height="66" rx="10" fill="#FFFFFF" stroke="#AABAC3" stroke-width="2" />
  <text x="86" y="376" font-size="36" fill="#182A35" font-weight="400" text-anchor="start">Brand website</text>
  <rect x="66" y="422" width="220" height="58" rx="10" fill="#182A35" />
  <text x="176" y="463" font-size="31" fill="#FFFFFF" font-weight="600" text-anchor="middle">Create</text>
  <path d="M481 536H519V561H540L500 602L460 561H481Z" fill="#182A35" />
  <text x="560" y="579" font-size="32" fill="#182A35" font-weight="650" text-anchor="start">Place it by the field</text>
  <text x="32" y="632" font-size="32" fill="#182A35" font-weight="650" text-anchor="start">After</text>
  <text x="968" y="632" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end">The label and limit are visible while typing</text>
  <rect x="32" y="660" width="936" height="425" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="735" font-size="43" fill="#182A35" font-weight="650" text-anchor="start">New project</text>
  <rect x="61" y="771" width="260" height="54" rx="8" fill="#FFF3B9" />
  <text x="72" y="810" font-size="36" fill="#182A35" font-weight="600" text-anchor="start">Project name</text>
  <rect x="66" y="844" width="868" height="66" rx="10" fill="#FFFFFF" stroke="#AABAC3" stroke-width="2" />
  <text x="86" y="890" font-size="36" fill="#182A35" font-weight="400" text-anchor="start">Brand website</text>
  <rect x="61" y="927" width="320" height="50" rx="8" fill="#FFF3B9" />
  <text x="72" y="962" font-size="32" fill="#5D6B73" font-weight="400" text-anchor="start">Up to 20 characters</text>
  <rect x="66" y="998" width="220" height="58" rx="10" fill="#182A35" />
  <text x="176" y="1039" font-size="31" fill="#FFFFFF" font-weight="600" text-anchor="middle">Create</text>
  </g>
  </svg>
