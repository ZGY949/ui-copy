<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Turn a filtering explanation into an action and result</title>
  <desc id="desc">Both views use the same Brand website and Product handbook data. The original paragraph is replaced with All, In progress, and Completed controls. Selecting In progress shows only Brand website. A static illustration, not proof of a working implementation.</desc>
<g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1000" height="1010" rx="22" fill="#F7F9F8" />
  <text x="32" y="53" font-size="32" fill="#5D6B73" font-weight="600" text-anchor="start">Before</text>
  <text x="968" y="53" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end">Explains filtering without an action</text>
  <rect x="32" y="84" width="936" height="365" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="159" font-size="43" fill="#182A35" font-weight="650" text-anchor="start">My projects</text>
  <rect x="62" y="192" width="876" height="108" rx="10" fill="#FFF3B9" />
  <text x="78" y="235" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start">You can filter the project list by status</text>
  <text x="78" y="283" font-size="36" fill="#5D6B73" font-weight="400" text-anchor="start">to see work in progress or completed.</text>
  <path d="M66 300H934" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="349" font-size="36" fill="#182A35" font-weight="600" text-anchor="start">Brand website</text>
  <text x="934" y="348" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end">In progress</text>
  <path d="M66 379H934" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="430" font-size="36" fill="#182A35" font-weight="600" text-anchor="start">Product handbook</text>
  <text x="934" y="429" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end">Completed</text>
  <path d="M481 476H519V501H540L500 542L460 501H481Z" fill="#182A35" />
  <text x="560" y="519" font-size="32" fill="#182A35" font-weight="650" text-anchor="start">Make it a real filter</text>
  <text x="32" y="562" font-size="32" fill="#182A35" font-weight="650" text-anchor="start">After</text>
  <text x="968" y="562" font-size="28" fill="#5D6B73" font-weight="400" text-anchor="end">Select a status to see matching projects</text>
  <rect x="32" y="590" width="936" height="365" rx="16" fill="#FFFFFF" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="665" font-size="43" fill="#182A35" font-weight="650" text-anchor="start">My projects</text>
  <rect x="66" y="701" width="868" height="73" rx="12" fill="#EDF2F4" stroke="#D7DFE3" stroke-width="2" />
  <rect x="320" y="708" width="300" height="59" rx="9" fill="#F3D46C" />
  <text x="193" y="748" font-size="36" fill="#182A35" font-weight="400" text-anchor="middle">All</text>
  <text x="470" y="748" font-size="36" fill="#182A35" font-weight="650" text-anchor="middle">In progress</text>
  <text x="777" y="748" font-size="36" fill="#182A35" font-weight="400" text-anchor="middle">Completed</text>
  <path d="M66 798H934" stroke="#D7DFE3" stroke-width="2" />
  <text x="66" y="847" font-size="36" fill="#182A35" font-weight="600" text-anchor="start">Brand website</text>
  <text x="934" y="846" font-size="30" fill="#5D6B73" font-weight="400" text-anchor="end">In progress</text>
  </g>
  </svg>
